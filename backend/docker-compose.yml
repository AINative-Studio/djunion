version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: djunion-postgres
    environment:
      POSTGRES_USER: djunion
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: djunion_dev
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djunion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: djunion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:14-alpine
    container_name: djunion-postgres-test
    environment:
      POSTGRES_USER: djunion_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: djunion_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:
