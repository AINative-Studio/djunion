version: '3.8'

services:
  postgres-test:
    image: postgres:14-alpine
    container_name: djunion-postgres-test
    environment:
      POSTGRES_USER: djunion_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: djunion_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djunion_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:6-alpine
    container_name: djunion-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio-test:
    image: minio/minio:latest
    container_name: djunion-minio-test
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9000"
      - "9002:9002"
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  minio_test_data:
