apiVersion: v1
kind: Secret
metadata:
  name: {{ include "djunion-relay-worker.fullname" . }}-secret
  labels:
    {{- include "djunion-relay-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  shoutcast-url: {{ .Values.stream.shoutcastUrl | quote }}
  stream-key: {{ .Values.stream.streamKey | quote }}
  s3-access-key: {{ .Values.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | quote }}
  redis-url: {{ .Values.redis.url | quote }}
