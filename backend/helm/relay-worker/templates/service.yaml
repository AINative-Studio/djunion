apiVersion: v1
kind: Service
metadata:
  name: {{ include "djunion-relay-worker.fullname" . }}
  labels:
    {{- include "djunion-relay-worker.labels" . | nindent 4 }}
    stream-id: {{ .Values.stream.id | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "djunion-relay-worker.selectorLabels" . | nindent 4 }}
    stream-id: {{ .Values.stream.id | quote }}
