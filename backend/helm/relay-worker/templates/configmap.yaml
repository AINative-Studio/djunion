apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "djunion-relay-worker.fullname" . }}-config
  labels:
    {{- include "djunion-relay-worker.labels" . | nindent 4 }}
data:
  s3-endpoint: {{ .Values.s3.endpoint | quote }}
  s3-bucket: {{ .Values.s3.bucket | quote }}
  s3-region: {{ .Values.s3.region | quote }}
  api-base-url: {{ .Values.api.baseUrl | quote }}
  environment: {{ .Values.environment | quote }}
