apiVersion: v1
kind: Secret
metadata:
  name: {{ include "djunion-api.fullname" . }}-secret
  labels:
    {{- include "djunion-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.database.url | quote }}
  jwt-private-key: {{ .Values.secrets.jwt.privateKey | quote }}
  jwt-public-key: {{ .Values.secrets.jwt.publicKey | quote }}
  redis-url: {{ .Values.secrets.redis.url | quote }}
  s3-access-key: {{ .Values.secrets.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3.secretKey | quote }}
