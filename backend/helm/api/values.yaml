# Default values for djunion-api
replicaCount: 2

image:
  repository: djunion/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/v1/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.djunion.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: djunion-api-tls
      hosts:
        - api.djunion.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - djunion-api
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /v1/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "info"

# Secrets mounted as environment variables
secrets:
  database:
    url: ""  # Set via --set secrets.database.url or values override
  jwt:
    privateKey: ""
    publicKey: ""
  redis:
    url: ""
  s3:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    bucket: ""
    region: "us-east-1"

# ConfigMap for non-sensitive configuration
config:
  corsOrigins: "https://djunion.com,https://www.djunion.com"
  rateLimitWindow: "60000"
  rateLimitMax: "100"
  uploadMaxSize: "104857600"  # 100MB

# Environment-specific overrides
environment: staging  # staging | production
