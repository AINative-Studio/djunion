# Promtail Configuration for DJ Union
# Log collection and forwarding to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Kubernetes pod logs
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only scrape pods in djunion namespace
      - source_labels: [__meta_kubernetes_namespace]
        regex: djunion
        action: keep

      # Extract pod name
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      # Extract container name
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

      # Extract namespace
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

      # Extract app label
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

      # Extract log path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __path__
        regex: (.+)
        action: replace

      # Default path for pod logs
      - replacement: /var/log/pods/*$1/*.log
        separator: /
        source_labels:
          - __meta_kubernetes_pod_uid
          - __meta_kubernetes_pod_container_name
        target_label: __path__

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            context: context
            error: error
            duration: duration
            status_code: status_code
            method: method
            path: path

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Set log level
      - labels:
          level:
          app:

      # Output formatting
      - output:
          source: message

  # API Server logs
  - job_name: api-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-server
          app: djunion-api
          __path__: /var/log/djunion/api/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: msg
            request_id: request_id
            user_id: user_id
            method: method
            path: path
            status_code: status_code
            duration: duration_ms

      - timestamp:
          source: timestamp
          format: RFC3339

      - labels:
          level:
          method:
          status_code:

  # Analytics Service logs
  - job_name: analytics-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: analytics-service
          app: analytics-service
          __path__: /var/log/djunion/analytics/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: msg
            event_type: event_type
            resource_id: resource_id

      - timestamp:
          source: timestamp
          format: RFC3339

      - labels:
          level:
          event_type:

  # Relay Worker logs
  - job_name: relay-workers
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - djunion
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: relay-worker
        action: keep

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_pod_label_stream_id]
        target_label: stream_id

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            stream_id: stream_id
            listener_count: listener_count
            error: error

      - timestamp:
          source: timestamp
          format: RFC3339

      - labels:
          level:
          stream_id:

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /var/log/nginx/access.log

    pipeline_stages:
      # Parse nginx access log format
      - regex:
          expression: '^(?P<remote_addr>[\d\.]+) - (?P<remote_user>[^ ]*) \[(?P<timestamp>[^\]]+)\] "(?P<method>\w+) (?P<path>[^ ]*) HTTP/[\d\.]+" (?P<status_code>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<user_agent>[^"]*)"'

      - timestamp:
          source: timestamp
          format: 02/Jan/2006:15:04:05 -0700

      - labels:
          method:
          status_code:

  # Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /var/log/nginx/error.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)'

      - timestamp:
          source: timestamp
          format: 2006/01/02 15:04:05

      - labels:
          level:

  # System logs (syslog)
  - job_name: syslog
    syslog:
      listen_address: 0.0.0.0:1514
      labels:
        job: syslog

    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'host'

      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'

      - source_labels: ['__syslog_message_severity']
        target_label: 'level'

  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            log: log
            timestamp: time

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - output:
          source: log

      - labels:
          stream:
